name: Banner deployment-local integration

on:
  pull_request:
    paths:
      - '.github/workflows/banner-local-integration.yml'
      - 'initial-configuration/**'
      - 'tests/banner-local-integration/**'
      - 'workflow-sha256.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aio-banner-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BANNER_LOCAL_BACKEND_ROOT: ${{ github.workspace }}/.proof-inputs/pic-sure
      BANNER_LOCAL_FRONTEND_ROOT: ${{ github.workspace }}/.proof-inputs/PIC-SURE-Frontend
      BANNER_LOCAL_MIGRATIONS_ROOT: ${{ github.workspace }}/.proof-inputs/PIC-SURE-Migrations
      BANNER_LOCAL_RELEASE_CONTROL_ROOT: ${{ github.workspace }}/.proof-inputs/baseline-pic-sure-release-control
      BANNER_LOCAL_BDC_ROOT: ${{ github.workspace }}/.proof-inputs/pic-sure-bdc-infrastructure
      BANNER_LOCAL_LEGACY_PSAMA_ROOT: ${{ github.workspace }}/.proof-inputs/pic-sure-auth-microapp

    steps:
      - name: Check out AIO proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check out exact backend input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/pic-sure
          ref: 0178bbd2d1753e07dcead77a6d0e8ca37bf76dd8
          path: .proof-inputs/pic-sure
          fetch-depth: 0

      - name: Check out exact frontend input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/PIC-SURE-Frontend
          ref: 7b69aa960ff98f97c1a2d026b7137b0e3dcdf603
          path: .proof-inputs/PIC-SURE-Frontend
          fetch-depth: 0

      - name: Check out exact migrations input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/PIC-SURE-Migrations
          ref: 05b1a77512dc0921570f0d442853fdcee75b8131
          path: .proof-inputs/PIC-SURE-Migrations
          fetch-depth: 0

      - name: Check out exact release-control input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/baseline-pic-sure-release-control
          ref: bfb07196be55f7f121dc250f7aa51d826642ff86
          path: .proof-inputs/baseline-pic-sure-release-control
          fetch-depth: 0

      - name: Check out exact BDC/AIM migration proof input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/pic-sure-bdc-infrastructure
          ref: 5d2ba9f59f161ace5e807c82a0580518a9d44d16
          path: .proof-inputs/pic-sure-bdc-infrastructure
          fetch-depth: 0

      - name: Check out exact legacy PSAMA owner input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hms-dbmi/pic-sure-auth-microapp
          ref: ca8ac3641ba122a93cda8a5d7cad7f23f7a46bb6
          path: .proof-inputs/pic-sure-auth-microapp
          fetch-depth: 0
          fetch-tags: true

      - name: Prove AIO banner integration
        env:
          BANNER_LOCAL_DIAGNOSTICS_ROOT: ${{ runner.temp }}/banner-local-integration-diagnostics
        run: tests/banner-local-integration/test.sh all

      - name: Upload banner integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: banner-local-integration-diagnostics
          path: ${{ runner.temp }}/banner-local-integration-diagnostics
          if-no-files-found: warn
          retention-days: 7
