# Build httpd/frontend from local source with auto-generated .env
# Use scripts/compose.sh dev up httpd to generate frontend configuration.
#
# Usage: scripts/compose.sh dev up httpd
services:
  httpd:
    build:
      context: ${FRONTEND_SRC:-./repos/PIC-SURE-Frontend}
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-httpd:dev
