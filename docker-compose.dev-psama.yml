# Build psama from local monorepo source with Java remote debugging enabled.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev-psama.yml up -d --build psama
#
# Requires: the reactor run INTO the checkout first — the Dockerfile only copies
# target/*.jar, and ./build-images.sh builds in a throwaway copy of the repo:
#   docker run --rm -v "${PICSURE_SRC:-$PWD/repos/pic-sure}:/src" -v maven_m2_cache:/root/.m2 \
#     -w /src maven:3-amazoncorretto-25 mvn -B clean install -T1C -DskipTests
services:
  psama:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-auth-microapp
      dockerfile: pic-sure-auth-services/Dockerfile
    image: hms-dbmi/pic-sure-psama:dev
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      JAVA_OPTS: >-
        ${PSAMA_JAVA_OPTS:--Xms1g -Xmx2g -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m}
        -Djava.net.preferIPv4Stack=true
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Djavax.net.ssl.trustStore=/application.truststore
        -Djavax.net.ssl.trustStorePassword=password
