# Build visualization service from local monorepo source
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev-visualization.yml up -d --build visualization
#
# Requires: the reactor run INTO the checkout first — the Dockerfile only copies
# target/*.jar, and ./build-images.sh builds in a throwaway copy of the repo:
#   docker run --rm -v "${PICSURE_SRC:-$PWD/repos/pic-sure}:/src" -v maven_m2_cache:/root/.m2 \
#     -w /src maven:3-amazoncorretto-25 mvn -B clean install -T1C -DskipTests
services:
  visualization:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-visualization-service
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-visualization:dev
