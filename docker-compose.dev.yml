# =============================================================================
# PIC-SURE All-in-One — Developer Overrides (ALL services)
# =============================================================================
# Builds every service that has a build entry below from local source
# (pic-sure-logging intentionally has none and runs :LATEST). Requires the
# sibling repos cloned and their artifacts built.
#
# Every service except httpd now comes out of the pic-sure monorepo, and every
# monorepo Dockerfile only copies its module's target/*.jar. ./build-images.sh
# builds the reactor in a throwaway copy of the repo, so it leaves
# repos/pic-sure/**/target empty — run the reactor INTO the checkout first:
#   docker run --rm -v "${PICSURE_SRC:-$PWD/repos/pic-sure}:/src" -v maven_m2_cache:/root/.m2 \
#     -w /src maven:3-amazoncorretto-25 mvn -B clean install -T1C -DskipTests
#
# This combined overlay is retained as a build-definition reference, not a
# complete frontend setup entry point: it cannot generate AIO's frontend .env.
# To rebuild and run the whole stack from source with generated configuration:
#   ./build-images.sh --force
#   scripts/compose.sh up
#
# For selected services, use the per-service wrappers (or matching CLI commands):
#   scripts/compose.sh dev up httpd
#   scripts/compose.sh dev up gateway
#   scripts/compose.sh dev up operations
#   scripts/compose.sh dev up query
#   scripts/compose.sh dev up psama
#   scripts/compose.sh dev up hpds
#   scripts/compose.sh dev up dictionary
#   scripts/compose.sh dev up visualization
# Run multiple wrapper commands to develop a subset. The httpd wrapper generates
# frontend configuration before the build and restores the source .env afterward.
#
# Source directories default to ./repos/ (cloned by ./clone-repos.sh)
# Override with environment variables: PICSURE_SRC, FRONTEND_SRC.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Gateway — build from local source
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-gateway
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-gateway:dev
    ports:
      - "127.0.0.1:5008:5008"  # Java debug port
    environment:
      JAVA_OPTS: >-
        ${GATEWAY_JAVA_OPTS:--Xms512m -Xmx2g}
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008

  # ---------------------------------------------------------------------------
  # Operations Service — build from local source
  # ---------------------------------------------------------------------------
  pic-sure-operations-service:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-operations-service
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-operations-service:dev
    ports:
      - "127.0.0.1:5009:5009"  # Java debug port
    environment:
      JAVA_OPTS: >-
        ${OPERATIONS_JAVA_OPTS:--Xms512m -Xmx2g}
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009

  # ---------------------------------------------------------------------------
  # HPDS Query Service — build from local source
  # ---------------------------------------------------------------------------
  pic-sure-hpds-query-service:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-hpds-query-service
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-hpds-query-service:dev
    ports:
      - "127.0.0.1:5010:5010"  # Java debug port
    environment:
      JAVA_OPTS: >-
        ${QUERY_SERVICE_JAVA_OPTS:--Xms512m -Xmx2g}
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010

  # ---------------------------------------------------------------------------
  # HPDS — build from local source
  # ---------------------------------------------------------------------------
  hpds:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-hpds
      dockerfile: docker/pic-sure-hpds/Dockerfile
    image: hms-dbmi/pic-sure-hpds:dev
    # hpds normally sits only on the internal query network, and Docker does
    # not forward host-published ports into all-internal containers — the
    # debug port would silently never connect. Joining app here deliberately
    # relaxes the isolation for the debug session.
    networks:
      - app
      - query
    ports:
      - "127.0.0.1:5007:5007"
    environment:
      JAVA_OPTS: >-
        ${HPDS_JAVA_OPTS:--XX:+UseParallelGC -XX:SurvivorRatio=250 -Xms1g -Xmx16g}
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007

  # ---------------------------------------------------------------------------
  # PSAMA — build from local source
  # ---------------------------------------------------------------------------
  psama:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-auth-microapp
      dockerfile: pic-sure-auth-services/Dockerfile
    image: hms-dbmi/pic-sure-psama:dev
    ports:
      - "127.0.0.1:5005:5005"  # Java debug port
    environment:
      JAVA_OPTS: >-
        ${PSAMA_JAVA_OPTS:--Xms1g -Xmx2g -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m}
        -Djava.net.preferIPv4Stack=true
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Djavax.net.ssl.trustStore=/application.truststore
        -Djavax.net.ssl.trustStorePassword=password

  # ---------------------------------------------------------------------------
  # HTTPD / Frontend — build from local source
  # ---------------------------------------------------------------------------
  httpd:
    build:
      context: ${FRONTEND_SRC:-./repos/PIC-SURE-Frontend}
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-httpd:dev

  # ---------------------------------------------------------------------------
  # Dictionary API — build from local source
  # ---------------------------------------------------------------------------
  dictionary-api:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/picsure-dictionary
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-dictionary-api:dev

  # ---------------------------------------------------------------------------
  # Dictionary Dump — build from local source
  # ---------------------------------------------------------------------------
  dictionary-dump:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/picsure-dictionary/aggregate
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-dictionary-dump:dev

  # ---------------------------------------------------------------------------
  # Visualization — build from local source
  # ---------------------------------------------------------------------------
  visualization:
    build:
      context: ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-visualization-service
      dockerfile: Dockerfile
    image: hms-dbmi/pic-sure-visualization:dev

  # ---------------------------------------------------------------------------
  # Shared build cache
  # ---------------------------------------------------------------------------
  # Maven .m2 cache is shared across builds to avoid re-downloading dependencies.
  # The monorepo Dockerfiles run no Maven of their own — this volume is the one
  # the reactor command in the header mounts at /root/.m2, same as build-images.sh.

volumes:
  maven_m2_cache:
    external: true
    name: maven_m2_cache
