# =============================================================================
# PIC-SURE All-in-One — Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env && ./init.sh && docker compose up -d
#
# Dev (build from source):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build hpds
#
# See README.md for the architecture overview and docs/operations.md for the
# operational runbook.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # HTTPD — Reverse Proxy + Frontend (ONLY public-facing container)
  # ---------------------------------------------------------------------------
  httpd:
    image: hms-dbmi/pic-sure-httpd:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: httpd
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs/server.crt:/usr/local/apache2/cert/server.crt:ro
      - ./certs/server.key:/usr/local/apache2/cert/server.key:ro
      - ./certs/server.chain:/usr/local/apache2/cert/server.chain:ro
      - ./config/httpd/httpd-vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
      - ./.data/logs/httpd:/app/logs
    environment:
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    networks:
      - public
      - app    # Needs to reach gateway and psama for reverse proxying
    depends_on:
      gateway:
        condition: service_started
      psama:
        condition: service_started
    # /picsure/health is answered locally by the vhost (no proxy, no SvelteKit
    # render), which is what the frontend image's own HEALTHCHECK probes.
    # 127.0.0.1, not localhost: the vhost only Listens on 0.0.0.0, so busybox
    # wget's first (IPv6) candidate is refused.
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "-q", "https://127.0.0.1/picsure/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway — PIC-SURE API front door (Spring Cloud Gateway)
  # ---------------------------------------------------------------------------
  # Routes /logging, /dictionary, /visualization, /hpds and /operations to the
  # services below and runs the PSAMA introspection auth chain in front of them.
  # The aio Spring profile supplies the AIO service DNS defaults for the
  # introspection URLs and the /system/status deep-health downstream list, so
  # only secrets and toggles are set here.
  gateway:
    image: hms-dbmi/pic-sure-gateway:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: gateway
    restart: always
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_PROFILE: aio
      # Auth chain
      TOKEN_INTROSPECTION_TOKEN: ${PICSURE_INTROSPECTION_TOKEN}
      QUERY_SERVICE_INTERNAL_TOKEN: ${QUERY_SERVICE_INTERNAL_TOKEN}
      GATEWAY_OPEN_ACCESS_ENABLED: ${GATEWAY_OPEN_ACCESS_ENABLED:-false}
      # Actuator (gated by X-Application-Token)
      PICSURE_APPLICATION_TOKEN: ${PICSURE_APPLICATION_TOKEN}
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      PICSURE_ACTUATOR_DETAILS: ${PICSURE_ACTUATOR_DETAILS:-when_authorized}
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    networks:
      - app
      - query    # /system/status deep-health probes hpds directly
    depends_on:
      psama:
        condition: service_started
      pic-sure-operations-service:
        condition: service_started
      pic-sure-hpds-query-service:
        condition: service_started
    # Liveness, not the deep aggregate: /actuator/health folds in the downstream
    # contributor, so an empty HPDS or dictionary would mark the gateway itself
    # unhealthy.  The liveness group is pinned to the app's own state
    # (application.yml) and stays open without the application token.
    # Deep, cross-service health is /system/status.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Operations Service — PIC-SURE DB owner (queries, datasets, configuration)
  # ---------------------------------------------------------------------------
  pic-sure-operations-service:
    image: hms-dbmi/pic-sure-operations-service:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: pic-sure-operations-service
    restart: always
    environment:
      JAVA_OPTS: ${OPERATIONS_JAVA_OPTS:--Xms512m -Xmx2g}
      # Database — the only service that talks to the picsure schema
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-picsure-db}:${DB_PORT:-3306}/picsure?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&autoReconnectForPools=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: picsure
      SPRING_DATASOURCE_PASSWORD: ${DB_PICSURE_PASSWORD}
      # Shared secret checked by InternalTokenFilter on /internal/**
      QUERY_SERVICE_INTERNAL_TOKEN: ${QUERY_SERVICE_INTERNAL_TOKEN}
      # Actuator (gated by X-Application-Token)
      PICSURE_APPLICATION_TOKEN: ${PICSURE_APPLICATION_TOKEN}
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      PICSURE_ACTUATOR_DETAILS: ${PICSURE_ACTUATOR_DETAILS:-when_authorized}
    networks:
      - app
    depends_on:
      flyway-init:
        condition: service_completed_successfully
    # Deep probe: the shallow aggregate stays open without the application token
    # and folds in the datasource indicator, so a broken picsure schema turns it
    # 503.  Context path is /operations.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/operations/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # HPDS Query Service — the only service allowed to reach HPDS
  # ---------------------------------------------------------------------------
  pic-sure-hpds-query-service:
    image: hms-dbmi/pic-sure-hpds-query-service:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: pic-sure-hpds-query-service
    restart: always
    environment:
      JAVA_OPTS: ${QUERY_SERVICE_JAVA_OPTS:--Xms512m -Xmx2g}
      # HPDS backends — one instance in all-in-one, so auth and open are equal
      HPDS_AUTH_URL: http://hpds:8080/PIC-SURE
      HPDS_OPEN_URL: http://hpds:8080/PIC-SURE
      # This service owns no database — query state lives in operations-service
      OPERATIONS_SERVICE_URL: http://pic-sure-operations-service:8080
      QUERY_SERVICE_INTERNAL_TOKEN: ${QUERY_SERVICE_INTERNAL_TOKEN}
      # Open-path aggregation / obfuscation
      VISUALIZATION_URL: http://visualization
      AGGREGATE_VISUALIZATION_RESOURCE_ID: ${PICSURE_VIZ_RESOURCE_ID:-}
      AGGREGATE_TARGET_RESOURCE_ID: ${OPEN_HPDS_RESOURCE_UUID:-}
      AGGREGATE_OBFUSCATION_THRESHOLD: ${OBFUSCATION_THRESHOLD:-10}
      AGGREGATE_OBFUSCATION_VARIANCE: ${OBFUSCATION_VARIANCE:-3}
      AGGREGATE_OBFUSCATION_SALT: ${AGGREGATE_OBFUSCATION_SALT}
      # Actuator (gated by X-Application-Token)
      PICSURE_APPLICATION_TOKEN: ${PICSURE_APPLICATION_TOKEN}
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      PICSURE_ACTUATOR_DETAILS: ${PICSURE_ACTUATOR_DETAILS:-when_authorized}
    networks:
      - app
      - query
    depends_on:
      hpds:
        condition: service_started
    # Liveness, not the deep aggregate: this service owns no datasource, so its
    # only deep indicator is HpdsHealthIndicator, which inherits HPDS's own
    # data-readiness DOWN on a fresh install.  Cross-service truth is the
    # gateway's /system/status.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # PSAMA — Auth Micro-App
  # ---------------------------------------------------------------------------
  psama:
    image: hms-dbmi/pic-sure-psama:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: psama
    restart: always
    volumes:
      - ./.data/logs/psama:/var/log
      - ./config/psama/application.truststore:/application.truststore:ro
    environment:
      JAVA_OPTS: >-
        ${PSAMA_JAVA_OPTS:--Xms2g -Xmx4g -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m -Djava.net.preferIPv4Stack=true}
        -Djavax.net.ssl.trustStore=/application.truststore
        -Djavax.net.ssl.trustStorePassword=password
      # Database
      DATASOURCE_URL: jdbc:mysql://${DB_HOST:-picsure-db}:${DB_PORT:-3306}/auth?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&autoReconnectForPools=true&serverTimezone=UTC
      DATASOURCE_USERNAME: auth
      DATASOURCE_PASSWORD: ${DB_AUTH_PASSWORD}
      # Auth
      APPLICATION_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      APPLICATION_CLIENT_SECRET_IS_BASE_64: "false"
      AUTH0_IDP_PROVIDER_IS_ENABLED: "true"
      AUTH0_HOST: https://${AUTH0_TENANT:-avillachlab}.auth0.com/
      OPEN_IDP_PROVIDER_IS_ENABLED: "${OPEN_IDP_PROVIDER_IS_ENABLED:-false}"
      STACK_SPECIFIC_APPLICATION_ID: ${PICSURE_APPLICATION_ID}
      # Tokens
      TOKEN_EXPIRATION_TIME: ${PSAMA_TOKEN_EXPIRATION:-3600000}
      LONG_TERM_TOKEN_EXPIRATION_TIME: ${PSAMA_LONG_TERM_TOKEN_EXPIRATION:-2592000000}
      # Email
      EMAIL_ADDRESS: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      # App config
      TOS_ENABLED: ${TOS_ENABLED:-false}
      SYSTEM_NAME: ${SYSTEM_NAME:-PIC-SURE All-in-one}
      AUTH0_DENIED_EMAIL_ENABLED: "false"
      # Actuator
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    networks:
      - app
    depends_on:
      flyway-init:
        condition: service_completed_successfully
    # Real HTTP probe: PSAMA ships Actuator, and PICSURE_ACTUATOR_EXPOSURE=health
    # puts a shallow, unauthenticated /auth/actuator/health behind the context
    # path (permit-listed in SecurityConfig).  Its aggregate includes the
    # datasource, so a broken DB turns the request into a 503, which wget
    # --spider treats as failure.  This is the same endpoint the gateway folds
    # into /system/status.  busybox wget is in the corretto-alpine base.
    # 127.0.0.1, not localhost: PSAMA_JAVA_OPTS sets preferIPv4Stack, so busybox
    # wget's first (IPv6) candidate for localhost is refused.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/auth/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # HPDS — High Performance Data Store
  # ---------------------------------------------------------------------------
  hpds:
    image: hms-dbmi/pic-sure-hpds:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: hpds
    restart: always
    volumes:
      - hpds-data:/opt/local/hpds
      - hpds-genomic:/opt/local/hpds/all
      - hpds-csv:/usr/local/docker-config/hpds_csv
      - hpds-query-results:/gic_query_results
      - ./.data/logs/hpds:/var/log
    environment:
      JAVA_OPTS: ${HPDS_JAVA_OPTS:--XX:+UseParallelGC -XX:SurvivorRatio=250 -Xms1g -Xmx16g}
      SPRING_PROFILES_ACTIVE: ${HPDS_PROFILE:-}
      ID_BATCH_SIZE: ${HPDS_ID_BATCH_SIZE:-0}
      CACHE_SIZE: ${HPDS_CACHE_SIZE:-1500}
      SMALL_TASK_THREADS: ${HPDS_SMALL_TASK_THREADS:-1}
      LARGE_TASK_THREADS: ${HPDS_LARGE_TASK_THREADS:-1}
      SMALL_JOB_LIMIT: ${HPDS_SMALL_JOB_LIMIT:-100}
      ALL_IDS_CONCEPT: NONE
      ID_CUBE_NAME: NONE
      ENABLE_FILE_SHARING: ${HPDS_ENABLE_FILE_SHARING:-true}
      VCF_EXCERPT_ENABLED: ${HPDS_VCF_EXCERPT_ENABLED:-true}
      HPDS_GENOMIC_DATA_DIRECTORY: ${HPDS_GENOMIC_DATA_DIRECTORY:-/opt/local/hpds/all/}
      HPDS_GENOMIC_PROCESSOR_IMPL: localPatientDistributed
      # Monorepo HPDS defaults this to true, which rejects V3 queries that
      # carry no authorizationFilters — the normal shape of AIO queries.
      # Only set true to control patient data access granularly (see
      # data.query.v3.Query.authorizationFilters).
      hpds.requireAuthorizationFilter: ${HPDS_REQUIRE_AUTHORIZATION_FILTER:-false}
      # Actuator
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    networks:
      - query
    # HPDS now ships Actuator; PICSURE_ACTUATOR_EXPOSURE=health exposes it at
    # the host root (not under the /PIC-SURE query context).  Liveness, not the
    # deep aggregate: HpdsReadinessHealthIndicator reports DOWN whenever no
    # phenotype/genomic data is loaded, which is the normal state of a fresh
    # install before the ETL runs — data readiness belongs in the gateway's
    # /system/status view, not in "is this container alive".  HPDS starts
    # slowly (data loading) and may crash-loop without data (especially with
    # the bch-dev profile); the long start_period defers evaluation until it
    # is expected to be up.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ---------------------------------------------------------------------------
  # Visualization — Chart/histogram service
  # ---------------------------------------------------------------------------
  visualization:
    image: hms-dbmi/pic-sure-visualization:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: visualization
    restart: always
    volumes:
      - ./.data/logs/visualization:/var/log
    environment:
      JAVA_OPTS: ${VISUALIZATION_JAVA_OPTS:--Xms512m -Xmx1g}
      SERVER_PORT: 80
      # Single HPDS ingress — this service never talks to HPDS directly
      HPDS_QUERY_SERVICE_URL: http://pic-sure-hpds-query-service:8080
      # Visualization tuning
      CHART_MAX_CATEGORIES: ${CHART_MAX_CATEGORIES:-7}
      REST_TEMPLATE_CONNECT_TIMEOUT: ${REST_TEMPLATE_CONNECT_TIMEOUT:-5000}
      REST_TEMPLATE_READ_TIMEOUT: ${REST_TEMPLATE_READ_TIMEOUT:-30000}
      # Actuator
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    networks:
      - app
    depends_on:
      pic-sure-hpds-query-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost/actuator/health 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Dictionary API (Optional)
  # ---------------------------------------------------------------------------
  dictionary-api:
    image: hms-dbmi/pic-sure-dictionary-api:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: dictionary-api
    restart: always
    env_file:
      - ./config/dictionary/dictionary.env
    environment:
      # Actuator
      PICSURE_ACTUATOR_EXPOSURE: ${PICSURE_ACTUATOR_EXPOSURE:-health}
      # Logging
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://pic-sure-logging/}
    volumes:
      - ./.data/logs/dictionary:/var/log
    networks:
      - app
      - data
    depends_on:
      dictionary-db:
        condition: service_healthy
      # Same invariant the MySQL tier states via flyway-init on psama and
      # operations-service: no consumer starts against a mid-migration schema.
      flyway-dictionary-init:
        condition: service_completed_successfully
    # dictionary-api (Spring Boot, server.port=80) now ships Actuator;
    # PICSURE_ACTUATOR_EXPOSURE=health exposes the shallow aggregate, which
    # includes the Postgres datasource.  Same endpoint the gateway folds into
    # /system/status.  busybox wget is in the corretto-alpine base.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Dictionary Dump / Aggregate (Optional)
  # ---------------------------------------------------------------------------
  dictionary-dump:
    image: hms-dbmi/pic-sure-dictionary-dump:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: dictionary-dump
    restart: always
    env_file:
      - ./config/dictionary/dictionary.env
    volumes:
      - ./.data/logs/dictionary:/var/log
    networks:
      - data
    depends_on:
      dictionary-db:
        condition: service_healthy
      flyway-dictionary-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # MySQL — picsure-db (auth + picsure schemas)
  # ---------------------------------------------------------------------------
  picsure-db:
    image: mysql:8.0
    container_name: picsure-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_PICSURE_PASSWORD: ${DB_PICSURE_PASSWORD}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_AIRFLOW_PASSWORD: ${DB_AIRFLOW_PASSWORD}
    volumes:
      - picsure-db-data:/var/lib/mysql
      - ./config/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      # Pass the password via MYSQL_PWD (read from the container's own
      # MYSQL_ROOT_PASSWORD env) instead of -p on argv, so it does not appear in
      # the container's process listing on every probe.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot"]
      timeout: 20s
      retries: 10
      start_period: 15s
      interval: 10s


  # ---------------------------------------------------------------------------
  # PostgreSQL — dictionary-db
  # ---------------------------------------------------------------------------
  dictionary-db:
    image: postgres:16-alpine
    container_name: dictionary-db
    restart: always
    env_file:
      - ./config/dictionary/dictionary.env
    volumes:
      - dictionary-db-data:/var/lib/postgresql/data
      # Baseline DDL from the monorepo — the Flyway migrations in
      # services/picsure-dictionary/db/flyway build on top of it.
      # create_host_path: false makes a missing checkout a hard start error;
      # otherwise Docker creates schema.sql as an empty DIRECTORY, Postgres
      # initializes PGDATA without the dict schema, and the volume is poisoned
      # (later starts skip initdb and report healthy).
      - type: bind
        source: ${PICSURE_SRC:-./repos/pic-sure}/services/picsure-dictionary/db/schema.sql
        target: /docker-entrypoint-initdb.d/schema.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picsure -d dictionary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Flyway — Database Migrations (init container — runs once and exits)
  # ---------------------------------------------------------------------------
  # Runs core and project-specific migrations in order.
  # Migration SQL files are mounted from the individual repos.
  # Use MIGRATION_NAME to run a non-Baseline project migration directory.
  #
  # depends_on picsure-db (service_healthy) ensures Flyway never attempts its
  # first connection before MySQL has passed its healthcheck.  Without this,
  # `pic-sure up` starts all services concurrently and Flyway can connect
  # before MySQL is accepting queries, exit non-zero, and leave
  # operations-service + psama permanently wedged (both gate on
  # service_completed_successfully).
  # FLYWAY_CONNECT_RETRIES is a belt-and-braces fallback: if the healthcheck
  # fires slightly early Flyway will retry up to 30 times before giving up.
  # The remote-db overlay resets this dependency via !reset — see
  # docker-compose.remote-db.yml.
  flyway-init:
    image: flyway/flyway:10
    container_name: flyway-init
    entrypoint: ["bash", "/scripts/run-migrations.sh"]
    volumes:
      - ./config/flyway/run-migrations.sh:/scripts/run-migrations.sh:ro
      # Auth migrations
      - ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-auth-microapp/pic-sure-auth-db/db/sql:/migrations/auth:ro
      # PIC-SURE API migrations
      - ${PICSURE_SRC:-./repos/pic-sure}/services/pic-sure-operations-service/db/sql:/migrations/picsure:ro
      # Project-specific migrations
      - ${MIGRATIONS_SRC:-./repos/PIC-SURE-Migrations}/${MIGRATION_NAME:-Baseline}/auth:/migrations/custom/auth:ro
      - ${MIGRATIONS_SRC:-./repos/PIC-SURE-Migrations}/${MIGRATION_NAME:-Baseline}/picsure:/migrations/custom/picsure:ro
    environment:
      DB_HOST: ${DB_HOST:-picsure-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_USER: ${DB_ROOT_USER:-root}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      FLYWAY_ACTION: ${FLYWAY_ACTION:-migrate}
      PICSURE_APPLICATION_ID: ${PICSURE_APPLICATION_ID}
      PICSURE_RESOURCE_ID: ${PICSURE_RESOURCE_ID}
      PICSURE_VIZ_RESOURCE_ID: ${PICSURE_VIZ_RESOURCE_ID}
      # Belt-and-braces: if the DB healthcheck fires marginally early, Flyway
      # will retry the connection up to 30 times (1 s apart) before failing.
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - app
    restart: "no"
    depends_on:
      # Wait for MySQL to be fully ready before Flyway attempts its first
      # connection.  service_healthy requires the healthcheck defined on
      # picsure-db to pass; that checks mysqladmin ping, which only succeeds
      # once the server is accepting queries.
      picsure-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Flyway — Dictionary Migrations (init container — runs once and exits)
  # ---------------------------------------------------------------------------
  # Separate one-shot rather than a second pass inside flyway-init, because the
  # two differ on every axis that Compose models:
  #   * Network — dictionary-db lives on the internal `data` tier; folding the
  #     dictionary pass into flyway-init would have to put the MySQL migration
  #     container on `data` too, widening its reach for no reason.
  #   * Credentials — Postgres creds come from the generated dictionary.env,
  #     not the .env DB_ROOT_* values flyway-init uses.
  #   * Remote DB mode — docker-compose.remote-db.yml clears flyway-init's
  #     depends_on with `!reset {}`.  The dictionary Postgres is always local,
  #     so its wait must not be swept away by that reset.
  #   * Blast radius — psama and operations-service gate on flyway-init
  #     completing; a dictionary migration failure should not wedge the auth
  #     tier, and vice versa.
  flyway-dictionary-init:
    image: flyway/flyway:10
    container_name: flyway-dictionary-init
    entrypoint: ["bash", "/scripts/run-dictionary-migrations.sh"]
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / POSTGRES_HOST, generated
    # by ./init.sh — the same file dictionary-db and dictionary-api read.
    env_file:
      - ./config/dictionary/dictionary.env
    volumes:
      - ./config/flyway/run-dictionary-migrations.sh:/scripts/run-dictionary-migrations.sh:ro
      # Dictionary migrations (monorepo). create_host_path: false — a missing
      # checkout must fail the start, not materialize an empty directory that
      # also makes clone-repos.sh think the repo exists.
      - type: bind
        source: ${PICSURE_SRC:-./repos/pic-sure}/services/picsure-dictionary/db/flyway
        target: /migrations/dictionary
        read_only: true
        bind:
          create_host_path: false
    environment:
      FLYWAY_ACTION: ${FLYWAY_ACTION:-migrate}
    networks:
      - data
    restart: "no"
    depends_on:
      dictionary-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Logging — Audit event collector
  # ---------------------------------------------------------------------------
  pic-sure-logging:
    image: hms-dbmi/pic-sure-logging:${PICSURE_IMAGE_TAG:-LATEST}
    container_name: pic-sure-logging
    restart: always
    volumes:
      - ./.data/logs/logging:/app/logs
    environment:
      LOGGING_API_KEY: ${LOGGING_API_KEY:-disabled}
      LOGGING_SERVICE_URL: http://pic-sure-logging
      APP: pic-sure
      PLATFORM: all-in-one
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 80
      ALLOWED_ORIGIN: "*"
    networks:
      - app
      - query    # hpds is isolated on the query tier but still emits audit events
    healthcheck:
      # pic-sure-logging is a Java/Javalin service on PORT 80 with a real
      # GET /health endpoint — the same probe its own image HEALTHCHECK uses
      # (repos/PIC-SURE-Logging/Dockerfile).
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# Networks
# =============================================================================
networks:
  # Public network — only httpd should be on this
  public:
    driver: bridge

  # App network — bridge (needs outbound internet for Auth0, email, etc.)
  # Services: gateway, psama, operations-service, hpds-query-service,
  # visualization, dictionary-api, picsure-db, flyway-init, logging
  # Note: PSAMA must reach Auth0 for token validation.
  app:
    driver: bridge

  # Data network — internal, no internet access
  # Services: dictionary-api, dictionary-dump, dictionary-db,
  # flyway-dictionary-init
  data:
    driver: bridge
    internal: true

  # Query network — internal, no internet access
  # Services: hpds, hpds-query-service, gateway, logging
  # Isolates HPDS from the app tier (visualization, dictionary, psama cannot
  # resolve it).  The query service is its query path; the gateway probes it
  # for /system/status; HPDS posts audit events to logging over this tier.
  # Bridge networks are symmetric, so gateway and logging CAN technically
  # reach HPDS — accepted: both memberships are required by the upstream aio
  # health/audit design, and this is still strictly tighter than the
  # reference deployment's single flat network.
  query:
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Database
  picsure-db-data:
  dictionary-db-data:

  # HPDS data
  hpds-data:
  hpds-genomic:
  hpds-csv:

  # HPDS query results (GIC file sharing)
  hpds-query-results:

  # Logs — bind-mounted to .data/logs/<service>/ (see volume mounts above)
