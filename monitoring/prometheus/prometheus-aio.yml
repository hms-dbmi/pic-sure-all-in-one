  # - job_name: psama
  #   metrics_path: /auth/actuator/prometheus
  #   http_headers:
  #     X-Application-Token:
  #       files: [/etc/prometheus/secrets/app-token]
  #   static_configs:
  #     - targets: ["psama:8090"]
  # - job_name: visualization
  #   metrics_path: /actuator/prometheus
